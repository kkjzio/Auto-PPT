[Credentials]
; 真正的秘钥文件 方便仓库所有者管理 | The real key file is convenient for warehouse owners to manage  >
; 将这里改为 config.ini !!! | Change this to config.ini !!!
Real_File = config.ini
; openai 代理方案 ，如果不需要可以不修改 https://github.com/chatanywhere/GPT_API_free
OPENAI_BASE_URL = https://api.siliconflow.cn/v1
; 你的openai 接口秘钥 | your openai api key
OPENAI_API_KEY = sk-your-openai-api-key-here
; 你的 unsplash 使用开关 | Switch for using Unsplash
UNSPLASH_ENABLE = false
; 你的 unsplash 接口秘钥 | your unsplash api key
; 使用','进行分割 | Use ',' for separation
UNSPLASH_API_KEY = key1,key2,key3,key4
; 使用redis 来缓存上下文 | uses redis to cache the context
REDIS_ENABLE = true
; redis URL | redis URL
REDIS_URL = redis://127.0.0.1:6379/0
; redis 密码 | redis password (可选，如果没有密码可以留空)
REDIS_PASSWORD = your_redis_password_here

; 示例配置说明：
; 1. 如果Redis没有密码，请保持REDIS_PASSWORD为空或者删除这一行
; 2. 如果Redis有密码，请填写正确的密码
; 3. 如果使用Redis URL格式包含密码，格式为：redis://:password@127.0.0.1:6379/0
; 4. REDIS_PASSWORD优先级高于URL中的密码