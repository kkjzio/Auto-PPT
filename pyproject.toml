[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-ppt"
version = "0.1.0"
description = "Auto-PPT: 基于大模型的PPT自动生成工具"
readme = "Readme.md"
license = {file = "LICENSE"}
authors = [
    {name = "Auto-PPT Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.9"
dependencies = [
    "aiohttp==3.8.4",
    "aiosignal==1.3.1",
    "async-timeout==4.0.2",
    "attrs==23.1.0",
    "blinker==1.6.2",
    "certifi==2023.5.7",
    "charset-normalizer==3.2.0",
    "click==8.1.5",
    "colorama==0.4.6",
    "dataclasses-json==0.5.9",
    "Flask==2.3.2",
    "Flask-Cors==4.0.0",
    "frozenlist==1.4.0",
    "greenlet==2.0.2",
    "idna==3.4",
    "importlib-metadata==6.8.0",
    "itsdangerous==2.1.2",
    "Jinja2==3.1.2",
    "langchain>=0.3.20,<0.4.0",
    "langchain-community>=0.3.0,<0.4.0",
    "langsmith>=0.1.112,<0.4.0",
    "lxml==4.9.3",
    "Markdown==3.5.1",
    "MarkupSafe==2.1.3",
    "marshmallow==3.19.0",
    "marshmallow-enum==1.5.1",
    "multidict==6.0.4",
    "mypy-extensions==1.0.0",    
    "numexpr==2.8.4",
    "numpy>=1.21.0",
    "openai==0.27.8",
    "openapi-schema-pydantic==1.2.4",
    "packaging>=23.2",
    "Pillow==10.0.0",
    "pydantic>=2.7.4,<3.0.0",
    "python-pptx==0.6.21",
    "pyunsplash==1.0.0rc2",
    "PyYAML==6.0",
    "redis==4.6.0",
    "requests==2.31.0",
    "SQLAlchemy==2.0.18",
    "tenacity==8.2.2",
    "tqdm==4.65.0",
    "typing-inspect==0.9.0",
    "typing_extensions==4.7.1",
    "urllib3==2.0.3",
    "Werkzeug==2.3.6",
    "XlsxWriter==3.1.2",
    "yarl==1.9.2",
    "zipp==3.16.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
]

[project.scripts]
auto-ppt = "application:main"

[project.urls]
Homepage = "https://github.com/your-username/auto-ppt"
Repository = "https://github.com/your-username/auto-ppt"
Issues = "https://github.com/your-username/auto-ppt/issues"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "flake8>=6.0.0",
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["mdtree", "generation", "chain", "readconfig", "outdated"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --cov=. --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = [".", "chain", "generation", "mdtree", "outdated", "readconfig", "myppt", "pptx_static", "templates"]
